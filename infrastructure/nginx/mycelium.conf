# Install on the VPS host after provisioning TLS certificates.
server {
    listen 80;
    server_name opportunities.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name opportunities.example.com;
    ssl_certificate /etc/letsencrypt/live/opportunities.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opportunities.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 600s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
