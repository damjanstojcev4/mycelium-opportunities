services:
  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      STORAGE_ROOT: /app/data/documents
    volumes:
      - documents:/app/data/documents
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8080
    environment:
      API_INTERNAL_URL: http://api:8080
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:17-alpine
    profiles: [local-db]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mycelium}
      POSTGRES_USER: ${POSTGRES_USER:-mycelium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [mail]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped
volumes:
  postgres:
  documents:
