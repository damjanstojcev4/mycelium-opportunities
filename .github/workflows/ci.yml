name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f apps/api/pom.xml verify
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start disposable acceptance API
        run: |
          mvn -B -f ../api/pom.xml spring-boot:test-run -Dspring-boot.run.main-class=com.mycelium.opportunities.TestApplication > /tmp/mycelium-api.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/mycelium-api.log
          exit 1
      - run: npm run test:e2e
