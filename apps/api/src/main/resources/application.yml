spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mycelium}
    username: ${DATABASE_USER:mycelium}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
server:
  forward-headers-strategy: native
  port: 8080
  error:
    include-message: never
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
management:
  health:
    mail:
      enabled: ${NOTIFICATIONS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  public-url: ${PUBLIC_URL:http://localhost:3000}
  mail-from: ${MAIL_FROM:opportunities@localhost}
  notifications-enabled: ${NOTIFICATIONS_ENABLED:false}
  storage-root: ${STORAGE_ROOT:./data/documents}
  ted-query: ${TED_QUERY:buyer-country IN (MKD BGR GRC) SORT BY publication-date DESC}
  scheduler-delay: ${SOURCE_POLL_DELAY_MS:60000}
springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs
